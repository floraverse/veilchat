<html lang="en">

<style>

</style>
<style>
.phone-row{display:grid;grid-template-columns:1fr;gap:8px}.privacy-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.privacy-row:last-child{border-bottom:0}.privacy-select{width:125px;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.65);color:var(--text)}.follow-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.profile-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}.profile-stats .stat{padding:10px 3px}.profile-stats .stat strong{font-size:17px}.profile-stats .stat span{font-size:9px}.notif-item{display:flex;gap:10px;align-items:center;padding:12px;border-radius:18px;margin:7px 0;background:rgba(255,255,255,.45)}.notif-item.unread{background:rgba(76,158,173,.12)}.notif-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover}.notif-main{flex:1;min-width:0}.notif-main strong{display:block}.notif-main .status{margin-top:3px}.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}.comment-box{margin-top:16px;text-align:left}.comment-item{padding:10px 0;border-bottom:1px solid var(--line)}.comment-item:last-child{border-bottom:0}.comment-head{font-size:12px;font-weight:800}.comment-text{font-size:13px;margin-top:4px;line-height:1.4}.profile-action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.daily-note{padding:10px 12px;border-radius:16px;background:rgba(76,158,173,.08);font-size:12px;color:var(--muted);margin-top:10px}.verified{width:18px;height:18px;vertical-align:-3px;margin-left:4px}.online-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#35a66f;margin-right:5px}.offline-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9aa8ac;margin-right:5px}
</style>

</head><body>
<div id="loading"><div class="loader"><div class="loader-logo">Veil</div><div class="spinner"></div></div></div>
<section id="loginScreen" class="login hidden"><div class="login-card glass"><div class="login-logo">Veil</div><p class="login-text">A clean and private social experience.</p><button id="googleLoginBtn" class="btn full">Continue with Google</button></div></section>
<div id="app" class="app hidden">
<header class="topbar glass"><div><div class="logo">Veil</div><div id="connectionStatus" class="status">Connecting…</div></div><button id="topProfileBtn" class="icon-btn">◉</button></header>
<main>
<section id="homePage" class="page active"><div class="card glass"><h2>Discover</h2><p class="status">Meet people, follow, like and find your match.</p><div id="dailyNote" class="daily-note"></div></div><div id="homeDiscover"></div><div id="homeMatches"></div></section>

<section id="notificationsPage" class="page"><div class="card glass"><h2>Notifications</h2><div id="notificationsList"></div></div></section>
<section id="profilePage" class="page"><div id="profileContainer"></div></section>
<section id="settingsPage" class="page"><div class="card glass"><h2>Settings</h2><div class="divider"></div><button id="editProfileBtn" class="btn secondary full">Edit Profile</button><div class="divider"></div><h3>Profile privacy</h3><p class="status">Name, username and profile photo are always public. Choose Public or Only Me for the other fields.</p><div id="visibilityContainer"></div><div class="divider"></div><button id="logoutBtn" class="btn danger full">Sign out</button></div></section>
<section id="editPage" class="page"><div class="card glass"><div class="chat-header"><button id="editBackBtn" class="back-btn">‹</button><h2 style="margin:0">Edit Profile</h2></div><div class="center"><img id="editAvatar" class="avatar" src="" alt="Profile photo"></div><div class="field"><label>Profile Photo <span style="color:var(--danger)">*</span></label><div id="photoControls"></div><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" class="hidden"></div><div id="verificationNote" class="verify-note"></div><div class="field"><label>Name <span style="color:var(--danger)">*</span></label><input id="nameInput" maxlength="80" autocomplete="name"></div><div class="field"><label>Username <span style="color:var(--danger)">*</span></label><input id="usernameInput" maxlength="30" placeholder="your_username" autocomplete="off"></div><div class="field"><label>Mobile Number <span style="color:var(--danger)">*</span></label><input id="phoneInput" type="tel" inputmode="numeric" maxlength="11" placeholder="01XXXXXXXXX" autocomplete="tel"></div><div class="field"><label>Gender <span style="color:var(--danger)">*</span></label><select id="genderInput"><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>District <span style="color:var(--danger)">*</span></label><select id="districtInput"><option value="">Select district</option></select></div><div class="field"><label>Bio</label><textarea id="bioInput" maxlength="300" placeholder="Tell people something about you…"></textarea></div><div class="field"><label>Age</label><input id="ageInput" type="number" min="18" max="100"></div><div class="card glass"><h3 style="margin-bottom:8px">Privacy</h3><div id="editPrivacyContainer"></div></div><button id="saveProfileBtn" class="btn full">Save Profile</button></div></section>
<section id="chatPage" class="page"><div class="card glass chat-card"><div class="chat-header"><button id="chatBackBtn" class="back-btn">‹</button><div><div id="chatTitle" class="chat-title">Chat</div><div id="chatSubtitle" class="chat-subtitle"></div></div></div><div id="messages" class="messages"></div><div class="composer"><input id="messageInput" maxlength="4000" placeholder="Message…"><button id="sendBtn" class="btn">Send</button></div></div></section>
</main>
<nav class="bottom-nav glass"><button class="nav-item active" data-page="homePage"><span class="nav-icon">⌂</span>Home</button><button class="nav-item" data-page="discoverPage"><span class="nav-icon">⌕</span>Search</button><button class="nav-item" data-page="notificationsPage"><span class="nav-icon">♢</span><span>Alerts</span><span id="notifCount" class="status"></span></button><button class="nav-item" data-page="profilePage"><span class="nav-icon">◉</span>Profile</button><button class="nav-item" data-page="settingsPage"><span class="nav-icon">⚙</span>Settings</button></nav>
</div><div id="toast" class="toast hidden"></div><div id="cameraModal" class="camera-modal hidden"><div class="camera-box"><video id="cameraVideo" class="camera-video" autoplay playsinline muted></video><div class="camera-actions"><button id="cameraCancel" class="btn secondary">Cancel</button><button id="cameraCapture" class="btn">Take Selfie</button></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,collection,query,where,orderBy,onSnapshot,addDoc,serverTimestamp,limit,getDocs,increment,deleteDoc,Timestamp,runTransaction,arrayUnion}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyA3Ebqc9zxeSaRTUDYymJk78-UYezD76SU",authDomain:"flora-veilchat.firebaseapp.com",projectId:"flora-veilchat",storageBucket:"flora-veilchat.firebasestorage.app",messagingSenderId:"352485676905",appId:"1:352485676905:web:8beb0df80a0daea2cccff8",measurementId:"G-CQKB9Z8VP1"};
const VERIFIED_BADGE="https://floraverse.github.io/veilchat/verified.png";
const ADMIN_EMAILS=["YOUR_ADMIN_EMAIL@gmail.com"];
const districts=["Bagerhat","Bandarban","Barguna","Barishal","Bhola","Bogura","Brahmanbaria","Chandpur","Chattogram","Chuadanga","Cox's Bazar","Cumilla","Dhaka","Dinajpur","Faridpur","Feni","Gaibandha","Gazipur","Gopalganj","Habiganj","Jamalpur","Jashore","Jhalokathi","Jhenaidah","Joypurhat","Khagrachhari","Khulna","Kishoreganj","Kurigram","Kushtia","Lakshmipur","Lalmonirhat","Madaripur","Magura","Manikganj","Meherpur","Moulvibazar","Munshiganj","Mymensingh","Naogaon","Narail","Narayanganj","Narsingdi","Natore","Netrokona","Nilphamari","Noakhali","Pabna","Panchagarh","Patuakhali","Pirojpur","Rajbari","Rajshahi","Rangamati","Rangpur","Satkhira","Shariatpur","Sherpur","Sirajganj","Sunamganj","Sylhet","Tangail"];
let auth,db,storage,currentUser,currentProfile,viewingProfile,activeChatUser,unsubscribeMessages,cameraStream,unsubscribeNotifications;
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const avatar=p=>p?.photoURL||"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="100%" height="100%" fill="#dceff3"/><circle cx="150" cy="110" r="52" fill="#7faeb8"/><path d="M50 280c15-70 55-100 100-100s85 30 100 100" fill="#7faeb8"/></svg>');
const badge=p=>p?.verified===true?`<img class="verified" src="${VERIFIED_BADGE}" alt="Verified">`:"";const chatId=(a,b)=>[a,b].sort().join("_");const isAdmin=()=>!!currentUser?.email&&ADMIN_EMAILS.map(x=>x.toLowerCase()).includes(currentUser.email.toLowerCase());
const dayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const dailyRef=()=>doc(db,"dailyDiscover",`${currentUser.uid}_${dayKey()}`);
function loading(v){$("loading").classList.toggle("hidden",!v)}function toast(t){$("toast").textContent=t;$("toast").classList.remove("hidden");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").classList.add("hidden"),3500)}
function showPage(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".nav-item").forEach(x=>x.classList.toggle("active",x.dataset.page===id));if(id==="homePage")renderHome();if(id==="profilePage")renderProfile(viewingProfile||currentProfile);if(id==="settingsPage")renderSettings();if(id==="notificationsPage")loadNotificationsOnce()}
async function loadProfile(){const s=await getDoc(doc(db,"users",currentUser.uid));if(s.exists()){currentProfile={uid:currentUser.uid,...s.data()};return true}currentProfile={uid:currentUser.uid,name:currentUser.displayName||"",username:"",phone:"",gender:"",district:"",photoURL:currentUser.photoURL||"",bio:"",age:"",visibility:{phone:false,gender:true,district:true,bio:true,age:false},verified:false,profileComplete:false};return false}
function completeProfile(p){return !!(p?.photoURL&&p?.name&&p?.username&&p?.phone&&/^01\d{9}$/.test(String(p.phone))&&p?.gender&&p?.district)}
function pub(p,k){const v=p?.visibility||{};return v[k]===true}
function stats(p){return `<div class="profile-stats"><div class="stat"><strong>${Number(p?.profileViews||0)}</strong><span>Views</span></div><div class="stat"><strong>${Number(p?.likesReceived||0)}</strong><span>Likes</span></div><div class="stat"><strong>${Number(p?.followersCount||0)}</strong><span>Followers</span></div><div class="stat"><strong>${Number(p?.friendsCount||0)}</strong><span>Friends</span></div><div class="stat"><strong>${Number(p?.matchesCount||0)}</strong><span>Matches</span></div></div>`}
function renderHome(){loadDiscover(true);loadMatches();}
async function reserveDailyProfiles(candidates){const refx=dailyRef();let selected=[];await runTransaction(db,async tx=>{const s=await tx.get(refx);const data=s.exists()?s.data():{};const shown=Array.isArray(data.shownIds)?data.shownIds:[];const remaining=Math.max(0,10-shown.length);selected=candidates.filter(p=>!shown.includes(p.uid)).slice(0,remaining);if(selected.length)tx.set(refx,{shownIds:arrayUnion(...selected.map(p=>p.uid)),count:shown.length+selected.length,date:dayKey(),uid:currentUser.uid},{merge:true});});return selected}
async function loadDiscover(home=false){const box=$(home?"homeDiscover":"usersList");try{const usage=await getDoc(dailyRef());const used=(usage.data()?.shownIds||[]).length;const remaining=Math.max(0,10-used);if(home&&remaining===0){box.innerHTML='<div class="card glass center empty"><h3>Daily limit reached</h3><div class="status">You can discover up to 10 profiles each day. Come back tomorrow.</div></div>';$('dailyNote').textContent='Today: 10 / 10 profiles discovered';return}const s=await getDocs(query(collection(db,"users"),limit(500)));const blocked=await getBlockedIds();const candidates=[];for(const d of s.docs){if(d.id===currentUser.uid||blocked.has(d.id))continue;const p={uid:d.id,...d.data()};if(!completeProfile(p))continue;const [likeDoc,passDoc]=await Promise.all([getDoc(doc(db,"likes",`${currentUser.uid}_${d.id}`)),getDoc(doc(db,"passes",`${currentUser.uid}_${d.id}`))]);if(likeDoc.exists()||passDoc.exists())continue;candidates.push(p)}const selected=home?await reserveDailyProfiles(candidates):candidates.filter(p=>!(usage.data()?.shownIds||[]).includes(p.uid)).slice(0,60);const usedAfter=used+selected.length;if(home)$('dailyNote').textContent=`Today: ${Math.min(10,usedAfter)} / 10 profiles discovered`;if(!selected.length){box.innerHTML='<div class="card glass center empty"><h3>No new profiles</h3><div class="status">No more eligible profiles are available right now.</div></div>';return}if(home)box.innerHTML=selected.map(discoverCard).join("");else{box.innerHTML=selected.map(userCard).join("");bindUserCards(box)}}catch(e){console.error(e);box.innerHTML='<div class="card glass center status">Could not load profiles. Check Firebase rules.</div>'}}

async function compressImage(file,maxKB=150){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=async()=>{URL.revokeObjectURL(url);let w=img.naturalWidth,h=img.naturalHeight,maxDim=1280;if(w>maxDim||h>maxDim){const scale=maxDim/Math.max(w,h);w=Math.round(w*scale);h=Math.round(h*scale)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);let q=.82,blob;for(let i=0;i<12;i++){blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));if(blob&&blob.size<=maxKB*1024)break;q-=.06;if(q<.2)break}if(!blob)reject(new Error("Image compression failed"));else resolve(blob)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Invalid image"))};img.src=url})}
async function saveProfile(){const name=$("nameInput").value.trim(),username=$("usernameInput").value.trim().replace(/^@/,""),phone=$("phoneInput").value.replace(/\D/g,"").trim(),gender=$("genderInput").value,district=$("districtInput").value,bio=$("bioInput").value.trim().slice(0,300),age=$("ageInput").value?Number($("ageInput").value):"";const file=$("photoInput").files[0];if(!name||!username||!phone||!gender||!district){toast("Name, username, mobile number, gender and district are required.");return}if(!/^01\d{9}$/.test(phone)){toast("Enter a valid Bangladesh mobile number (01XXXXXXXXX).");return}if(!/^[A-Za-z0-9_.]{3,30}$/.test(username)){toast("Username must be 3–30 letters, numbers, _ or .");return}if(age&&(age<18||age>100)){toast("Age must be between 18 and 100.");return}if(!currentProfile.photoURL&&!file){toast("Take a selfie first.");return}loading(true);try{if(username.toLowerCase()!==(currentProfile.usernameLower||"")&&!await usernameAvailable(username)){toast("This username is already taken.");return}let photoURL=currentProfile.photoURL||"",photoSource=currentProfile.photoSource||"";if(file){const src=$("photoInput").dataset.source||"gallery";if(src==="gallery"&&!isAdmin()){toast("Gallery selection is restricted.");return}const blob=await compressImage(file,150);const r=ref(storage,`profilePhotos/${currentUser.uid}/${Date.now()}.jpg`);await uploadBytes(r,blob,{contentType:"image/jpeg",cacheControl:"public,max-age=31536000"});photoURL=await getDownloadURL(r);photoSource=src;$("verificationNote").innerHTML=`Photo compressed to ${(blob.size/1024).toFixed(0)} KB and uploaded.`}const complete=!!(photoURL&&name&&username&&phone&&gender&&district);const data={uid:currentUser.uid,name,nameLower:name.toLowerCase(),username,usernameLower:username.toLowerCase(),phone,gender,district,photoURL,photoSource,bio,age,profileComplete:complete,verified:photoSource==="camera"&&complete,visibility:currentProfile.visibility||{phone:false,gender:true,district:true,bio:true,age const DB_NAME="veilLocal",DB_VERSION=1;function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("messages"))r.result.createObjectStore("messages",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function localSave(m){try{const dbx=await idb(),tx=dbx.transaction("messages","readwrite");tx.objectStore("messages").put(m)}catch(e){console.error(e)}}async function localLoad(cid){try{const dbx=await idb(),tx=dbx.transaction("messages","readonly"),st=tx.objectStore("messages");return await new Promise((res,rej)=>{const a=[];const r=st.openCursor();r.onsuccess=()=>{const c=r.result;if(!c)return res(a.filter(x=>x.chatId===cid).sort((x,y)=>(x.createdMs||0)-(y.createdMs||0)));if(c.value.chatId===cid)a.push(c.value);c.continue()};r.onerror=()=>rej(r.error)})}catch(e){return []}}
async function renderMessages(extra=[]){if(!activeChatUser)return;const cid=chatId(currentUser.uid,activeChatUser.uid),local=await localLoad(cid),map=new Map();[...local,...extra].forEach(m=>map.set(m.id,m));const now=Date.now();const arr=[...map.values()].filter(m=>!m.expiresMs||m.expiresMs>now).sort((a,b)=>(a.createdMs||0)-(b.createdMs||0));$("messages").innerHTML=arr.map(m=>`<div class="message ${m.senderId===currentUser.uid?'mine':'theirs'}">${esc(m.text||"")}</div>`).join("");$("messages").scrollTop=$("messages").scrollHeight}
async function listenMessages(){if(unsubscribeMessages)unsubscribeMessages();const cid=chatId(currentUser.uid,activeChatUser.uid),mref=collection(db,"chats",cid,"messages"),q=query(mref,orderBy("createdAt","asc"),limit(300));unsubscribeMessages=onSnapshot(q,async s=>{const now=Date.now(),fresh=[];for(const d of s.docs){const m=d.data(),created=m.createdAt?.toMillis?.()||now,expires=m.expiresAt?.toMillis?.()||created+86400000;const local={id:d.id,chatId:cid,senderId:m.senderId,receiverId:m.receiverId,text:m.text||"",createdMs:created,expiresMs:expires};if(expires>now){await localSave(local);fresh.push(local);if(m.receiverId===currentUser.uid){try{await deleteDoc(d.ref)}catch(e){}}}else{try{await deleteDoc(d.ref)}catch(e){}}}await renderMessages(fresh)},e=>{console.error(e);toast("Chat connection failed.")});renderMessages()}

async function captureSelfie(){const v=$("cameraVideo");if(!v.videoWidth){toast("Camera is not ready.");return}const c=document.createElement("canvas");c.width=Math.min(v.videoWidth,1280);c.height=Math.round(c.width*v.videoHeight/v.videoWidth);c.getContext("2d").drawImage(v,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));if(!blob){toast("Could not capture selfie.");return}const file=new File([blob],`selfie-${Date.now()}.jpg`,{type:"image/jpeg"});const dt=new DataTransfer();dt.items.add(file);$("photoInput").files=dt.files;$("editAvatar").src=URL.createObjectURL(blob);$("verificationNote").innerHTML="📷 Selfie captured. Save your profile to upload the compressed selfie and verify the profile.";$("photoInput").dataset.source="camera";closeCamera()}

async function renderNotifications(docs){const box=$("notificationsList");if(!docs.length){box.innerHTML='<div class="status">No notifications yet.</div>';$('notifCount').textContent="";return}let unread=0,out=[];for(const d of docs){const n=d.data();if(!n.read)unread++;const u=await getDoc(doc(db,"users",n.actorId));const p=u.exists()?{uid:u.id,...u.data()}:{uid:n.actorId,name:"User"};const text={follow:"followed you",like:"liked your profile",match:"matched with you",friend:"became your friend",comment:"commented on your profile",message:"sent you a message"}[n.type]||"interacted with you";const action=n.type==="follow"?`<button class="btn secondary notif-follow" data-uid="${esc(p.uid)}">Follow Back</button>`:"";out.push(`<div class="notif-item ${n.read?'':'unread'}" data-notif="${esc(d.id)}" data-actor="${esc(p.uid)}" data-type="${esc(n.type)}"><img class="notif-avatar" src="${esc(avatar(p))}"><div class="notif-main"><strong>${esc(p.name)}${badge(p)}</strong><div>${esc(text)}</div><div class="status">${n.createdAt?.toDate?n.createdAt.toDate().toLocaleString():"Just now"}</div></div>${action}${n.read?'':'<span class="notif-dot"></span>'}</div>`)}box.innerHTML=out.join("");$('notifCount').textContent=unread?`(${unread})`:"";box.querySelectorAll(".notif-item").forEach(el=>el.onclick=async e=>{if(e.target.closest(".notif-follow"))return;const id=el.dataset.notif;try{await updateDoc(doc(db,"notifications",currentUser.uid,"items",id),{read:true})}catch(e){}const actor=el.dataset.actor,type=el.dataset.type;if(type==="message"||type==="match"){const u=await getDoc(doc(db,"users",actor));if(u.exists())startChat({uid:u.id,...u.data()})}else openUser(actor)});box.querySelectorAll(".notif-follow").forEach(b=>b.onclick=async e=>{e.stopPropagation();const u=await getDoc(doc(db,"users",b.dataset.uid));if(u.exists()){await followUser({uid:u.id,...u.data()});b.textContent="Following";b.disabled=true}})}
function listenNotifications(){if(unsubscribeNotifications)unsubscribeNotifications();const q=query(collection(db,"notifications",currentUser.uid,"items"),orderBy("createdAt","desc"),limit(50));unsubscribeNotifications=onSnapshot(q,s=>renderNotifications(s.docs),e=>console.error("notifications",e))}
async function authState(user){if(!user){currentUser=null;if(unsubscribeNotifications)unsubscribeNotifications();$("app").classList.add("hidden");$("loginScreen").classList.remove("hidden");loading(false);return}currentUser=user;$("loginScreen").classList.add("hidden");$("app").classList.remove("hidden");$("connectionStatus").textContent="Connected";try{const exists=await loadProfile();await updateDoc(doc(db,"users",currentUser.uid),{lastActiveAt:serverTimestamp()}).catch(()=>{});const incomplete=!exists||!completeProfile(currentProfile);if(incomplete)openEdit();else{viewingProfile=currentProfile;showPage("homePage")}listenNotifications()}catch(e){console.error(e);toast("Could not load your profile.")}finally{loading(false)}}
for(const d of districts)$("districtInput").insertAdjacentHTML("beforeend",`<option value="${esc(d)}">${esc(d)}</option>`);
$("googleLoginBtn").onclick=async()=>{try{loading(true);await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){console.error(e);toast(e.message||"Google sign-in failed.")}finally{loading(false)}};
$("editProfileBtn").onclick=openEdit;$("editBackBtn").onclick=()=>showPage("profilePage");$("saveProfileBtn").onclick=saveProfile;$("logoutBtn").onclick=()=>signOut(auth);$("topProfileBtn").onclick=()=>{viewingProfile=currentProfile;showPage("profilePage")};let searchTimer;$("searchInput").oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>searchUsers($("searchInput").value.trim()),350)};$("sendBtn").onclick=sendMessage;$("messageInput").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}};$("chatBackBtn").onclick=()=>{if(unsubscribeMessages)unsubscribeMessages();activeChatUser=null;showPage("homePage")};$("photoInput").onchange=()=>{const f=$("photoInput").files[0];if(f){$("editAvatar").src=URL.createObjectURL(f);$("photoInput").dataset.source="gallery";$("verificationNote").innerHTML=isAdmin()?"🖼️ Gallery image selected. It will be compressed before upload.":""}};$("cameraCancel").onclick=closeCamera;$("cameraCapture").onclick=captureSelfie;document.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>{if(b.dataset.page==="profilePage")viewingProfile=currentProfile;showPage(b.dataset.page);if(b.dataset.page==="discoverPage")loadDiscover(false)});document.addEventListener("click",e=>{const card=e.target.closest("[data-discover-id]");if(!card)return;const action=e.target.closest("[data-action]")?.dataset.action;if(!action)return;getDoc(doc(db,"users",card.dataset.discoverId)).then(s=>{if(!s.exists())return;const p={uid:s.id,...s.data()};if(action==="view")openUser(p.uid);else reactToProfile(p,action)})});
async function start(){try{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);storage=getStorage(app);await setPersistence(auth,browserLocalPersistence);onAuthStateChanged(auth,authState)}catch(e){console.error(e);loading(false);toast("Firebase initialization failed. Check Firebase settings.")}}start();
</script></body></html>
