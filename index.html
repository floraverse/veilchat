<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eaf8fa">
<title>Veil</title>

<style>
:root{
 --bg:#eaf8fa;--glass:rgba(255,255,255,.52);
 --glass2:rgba(255,255,255,.72);--line:rgba(255,255,255,.82);
 --text:#18343c;--muted:#718990;--accent:#4c9ead;
 --danger:#c85d67;--shadow:0 15px 45px rgba(50,110,125,.13)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,
 Segoe UI,Roboto,sans-serif;color:var(--text);
 background:radial-gradient(circle at 15% 5%,#fff,transparent 32%),
 radial-gradient(circle at 90% 85%,#c9eef4,transparent 38%),var(--bg)
}
body:before{
 content:"";position:fixed;inset:-35%;z-index:-1;pointer-events:none;
 background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.65),transparent 25%),
 radial-gradient(circle at 70% 65%,rgba(123,211,226,.25),transparent 30%);
 filter:blur(45px)
}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}
.glass{
 background:var(--glass);border:1px solid var(--line);
 box-shadow:var(--shadow);backdrop-filter:blur(25px);
 -webkit-backdrop-filter:blur(25px)
}
#loading{
 position:fixed;inset:0;z-index:9999;display:flex;
 align-items:center;justify-content:center;background:rgba(235,249,251,.82);
 backdrop-filter:blur(18px)
}
.loader{text-align:center}.loader-logo{font-size:42px;font-weight:900}
.spinner{
 width:28px;height:28px;margin:18px auto 0;border:3px solid rgba(76,158,173,.2);
 border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.app{width:100%;max-width:720px;min-height:100vh;margin:auto;padding-bottom:94px}
.topbar{
 position:sticky;top:10px;z-index:100;margin:10px 12px;padding:10px 13px;
 border-radius:23px;display:flex;align-items:center;justify-content:space-between
}
.logo{font-size:24px;font-weight:900}.status{color:var(--muted);font-size:11px}
.top-profile{
 width:44px;height:44px;border-radius:50%;object-fit:cover;
 border:2px solid rgba(255,255,255,.9);background:#d9edf1
}
main{padding:4px 12px}.page{display:none}.page.active{display:block}
.card{border-radius:25px;padding:18px;margin:12px 0}.center{text-align:center}
h2,h3{margin-top:0}
.avatar{
 width:94px;height:94px;border-radius:50%;object-fit:cover;
 background:#d9edf1;border:3px solid rgba(255,255,255,.9);
 box-shadow:0 9px 25px rgba(40,100,115,.15)
}
.avatar.small{width:55px;height:55px}
.profile-name{margin-top:10px;font-size:23px;font-weight:800}
.username{margin-top:3px;color:var(--muted);font-size:13px}
.verified{
 width:18px;height:18px;object-fit:contain;vertical-align:-3px;margin-left:4px
}
.profile-basic{margin-top:12px;color:var(--muted);font-size:13px}
.bio{margin:16px auto 0;max-width:500px;line-height:1.55}
.btn{
 min-height:44px;padding:11px 17px;border-radius:16px;background:var(--accent);
 color:white;font-weight:750
}
.btn:active{transform:scale(.98)}
.btn.secondary{
 color:var(--text);background:rgba(255,255,255,.6);
 border:1px solid var(--line)
}
.btn.danger{background:var(--danger)}.full{width:100%}
.btn.following{background:rgba(76,158,173,.16);color:#397f8d}
.field{margin:13px 0}
.field label{
 display:block;margin-bottom:5px;color:var(--muted);font-size:12px;font-weight:700
}
input,textarea,select{
 width:100%;border:1px solid rgba(100,155,165,.22);border-radius:16px;
 outline:none;color:var(--text);background:rgba(255,255,255,.55);padding:13px 14px
}
textarea{min-height:95px;resize:vertical}
.login{
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px
}
.login-card{
 width:min(430px,100%);text-align:center;padding:30px 22px;border-radius:30px
}
.login-logo{font-size:46px;font-weight:950}
.login-text{color:var(--muted);line-height:1.5;margin:7px 0 25px}
.bottom-nav{
 position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
 z-index:500;width:min(696px,calc(100% - 20px));padding:7px;
 border-radius:25px;display:grid;grid-template-columns:repeat(3,1fr)
}
.nav-item{
 padding:8px 4px;border-radius:18px;color:var(--muted);
 background:transparent;font-size:11px
}
.nav-item.active{
 color:#397f8d;background:rgba(255,255,255,.65);font-weight:800
}
.nav-icon{display:block;font-size:20px;line-height:22px;margin-bottom:2px}
.search-box{position:sticky;top:78px;z-index:20}
.user-card{
 display:flex;align-items:center;gap:12px;margin:9px 0;padding:12px;border-radius:21px
}
.user-card-info{flex:1;min-width:0}.user-name{font-weight:750}
.user-meta{color:var(--muted);font-size:12px;margin-top:3px}
.setting-row{
 display:flex;align-items:center;justify-content:space-between;
 gap:12px;padding:15px 0
}
.setting-left{min-width:0}.setting-title{font-weight:750}
.setting-value{
 display:flex;align-items:center;gap:4px;flex-shrink:0;
 padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.58);
 font-size:12px;color:#397f8d
}
.setting-value span{font-size:13px}
.divider{height:1px;background:rgba(90,145,155,.13);margin:12px 0}
.toggle{
 width:48px;height:27px;border-radius:20px;
 background:rgba(90,120,130,.25);padding:3px
}
.toggle span{
 display:block;width:21px;height:21px;border-radius:50%;
 background:#fff;transition:.2s
}
.toggle.on{background:var(--accent)}
.toggle.on span{transform:translateX(21px)}
.profile-actions{
 display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:18px
}
.stats{
 display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:18px
}
.stat{
 padding:12px;border-radius:16px;background:rgba(255,255,255,.42);
 text-align:center
}
.stat strong{display:block;font-size:18px}.stat small{color:var(--muted)}
.chat-card{
 height:calc(100vh - 160px);min-height:430px;
 display:flex;flex-direction:column
}
.chat-header{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.chat-title{font-weight:800}.chat-subtitle{color:var(--muted);font-size:11px}
.back-btn{
 width:42px;height:42px;border-radius:50%;
 background:rgba(255,255,255,.55);color:var(--text);
 display:flex;align-items:center;justify-content:center;font-size:25px
}
.messages{flex:1;overflow-y:auto;padding:8px 2px}
.message{
 max-width:78%;margin:6px 0;padding:10px 13px;border-radius:18px;
 line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere
}
.message.mine{
 margin-left:auto;background:rgba(76,158,173,.86);color:#fff;
 border-bottom-right-radius:5px
}
.message.theirs{
 background:rgba(255,255,255,.7);border-bottom-left-radius:5px
}
.composer{display:flex;gap:8px;padding-top:8px}
.composer input{margin:0}
.toast{
 position:fixed;z-index:10000;left:50%;bottom:95px;
 transform:translateX(-50%);max-width:90%;padding:12px 16px;
 border-radius:16px;background:rgba(20,42,49,.9);color:white;
 font-size:13px;text-align:center
}

/* For You */
.foryou-wrap{min-height:calc(100vh - 185px);display:flex;flex-direction:column}
.discovery-card{
 position:relative;overflow:hidden;border-radius:30px;
 padding:0;margin:10px 0;min-height:550px;
 display:flex;flex-direction:column;justify-content:flex-end
}
.discovery-photo{
 position:absolute;inset:0;width:100%;height:100%;
 object-fit:cover;background:#d9edf1
}
.discovery-overlay{
 position:absolute;inset:35% 0 0;
 background:linear-gradient(transparent,rgba(10,35,40,.86))
}
.discovery-info{
 position:relative;z-index:2;color:white;padding:24px 20px
}
.discovery-name{font-size:27px;font-weight:850}
.discovery-meta{font-size:13px;margin-top:7px;opacity:.9}
.discovery-bio{font-size:14px;line-height:1.45;margin-top:10px}
.swipe-actions{
 display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin:10px 0
}
.swipe-btn{
 height:54px;border-radius:19px;background:rgba(255,255,255,.72);
 color:var(--text);font-size:20px;border:1px solid var(--line)
}
.swipe-btn.primary{background:var(--accent);color:white}
.no-users{padding:40px 20px;text-align:center;color:var(--muted)}

.camera-preview{
 width:180px;height:180px;border-radius:50%;object-fit:cover;
 background:#d9edf1;border:4px solid rgba(255,255,255,.9)
}
.camera-box{
 padding:15px;border-radius:22px;background:rgba(255,255,255,.35);
 text-align:center;margin-bottom:12px
}
.camera-box video{
 width:100%;max-width:360px;border-radius:20px;
 background:#17333b;display:none
}
.camera-controls{display:flex;gap:8px;justify-content:center;margin-top:10px}
.small-note{font-size:11px;color:var(--muted);margin-top:6px}

.about-content{line-height:1.65;color:var(--text);white-space:pre-wrap}

@media(max-width:480px){
 .card{padding:15px}
 .chat-card{height:calc(100vh - 145px)}
 .message{max-width:84%}
 .discovery-card{min-height:500px}
 .discovery-name{font-size:24px}
}
</style>
</head>

<body>

<div id="loading">
 <div class="loader">
  <div class="loader-logo">Veil</div>
  <div class="spinner"></div>
 </div>
</div>

<section id="loginScreen" class="login hidden">
 <div class="login-card glass">
  <div class="login-logo">Veil</div>
  <p class="login-text">A clean and private social experience.</p>
  <button id="googleLoginBtn" class="btn full">Continue with Google</button>
 </div>
</section>

<div id="app" class="app hidden">

<header class="topbar glass">
 <div>
  <div class="logo">Veil</div>
  <div id="connectionStatus" class="status">Connecting…</div>
 </div>
 <button id="topProfileBtn" style="background:none;padding:0">
  <img id="topProfileImage" class="top-profile" src="" alt="Profile">
 </button>
</header>

<main>

<!-- HOME -->
<section id="homePage" class="page active">
 <div class="card glass center">
  <h2>Welcome to Veil</h2>
  <p class="status">Your account is connected.</p>
 </div>
 <div id="homeProfile"></div>
</section>

<!-- FOR YOU -->
<section id="foryouPage" class="page">
 <div class="foryou-wrap">
  <div id="foryouCard"></div>
  <div id="foryouActions" class="swipe-actions hidden">
   <button id="passBtn" class="swipe-btn">✕</button>
   <button id="followForYouBtn" class="swipe-btn primary">Follow</button>
   <button id="nextBtn" class="swipe-btn">♥</button>
  </div>
 </div>
</section>

<!-- PROFILE -->
<section id="profilePage" class="page">
 <div id="profileContainer"></div>
</section>

<!-- SETTINGS -->
<section id="settingsPage" class="page">

 <div class="card glass">
  <h2>Settings</h2>

  <button id="editProfileBtn" class="btn secondary full">
   Edit Profile
  </button>

  <div class="divider"></div>

  <h3>Privacy</h3>

  <div id="privacyContainer"></div>

  <div class="divider"></div>

  <div class="setting-row">
   <div class="setting-left">
    <div class="setting-title">Online Status</div>
   </div>
   <button id="onlineToggle" class="toggle">
    <span></span>
   </button>
  </div>

  <div class="divider"></div>

  <button id="aboutBtn" class="btn secondary full">About Veil</button>

  <div class="divider"></div>

  <button id="logoutBtn" class="btn danger full">Sign out</button>
 </div>

</section>

<!-- EDIT PROFILE -->
<section id="editPage" class="page">

 <div class="card glass">

  <div class="chat-header">
   <button id="editBackBtn" class="back-btn">‹</button>
   <h2 style="margin:0">Edit Profile</h2>
  </div>

  <div class="camera-box">

   <img id="editAvatar" class="camera-preview" src="" alt="Selfie">

   <video id="cameraVideo" autoplay playsinline></video>
   <canvas id="cameraCanvas" class="hidden"></canvas>

   <div class="camera-controls">
    <button id="openCameraBtn" class="btn secondary">Camera</button>
    <button id="captureBtn" class="btn hidden">Capture Selfie</button>
   </div>

   <div class="small-note">Profile photo must be taken with the camera.</div>

  </div>

  <div class="field">
   <label>Name *</label>
   <input id="nameInput" maxlength="80" autocomplete="name">
  </div>

  <div class="field">
   <label>Username *</label>
   <input id="usernameInput" maxlength="30" placeholder="your_username" autocomplete="off">
  </div>

  <div class="field">
   <label>Gender *</label>
   <select id="genderInput">
    <option value="">Select gender</option>
    <option>Male</option>
    <option>Female</option>
    <option>Other</option>
   </select>
  </div>

  <div class="field">
   <label>Date of Birth *</label>
   <input id="dobInput" type="date">
  </div>

  <div class="field">
   <label>District *</label>
   <select id="districtInput">
    <option value="">Select district</option>
   </select>
  </div>

  <div class="field">
   <label>Thana / Upazila *</label>
   <input id="thanaInput" maxlength="80">
  </div>

  <div class="field">
   <label>Post Office *</label>
   <input id="postOfficeInput" maxlength="100">
  </div>

  <div class="field">
   <label>Postal Code *</label>
   <input id="postalCodeInput" maxlength="20" inputmode="numeric">
  </div>

  <div class="field">
   <label>Phone Number *</label>
   <input id="phoneInput" maxlength="30" inputmode="tel">
  </div>

  <div class="field">
   <label>NID Number *</label>
   <input id="nidInput" maxlength="30" inputmode="numeric">
  </div>

  <div class="field">
   <label>Bio *</label>
   <textarea id="bioInput" maxlength="300"></textarea>
  </div>

  <div class="field">
   <label>Age *</label>
   <input id="ageInput" type="number" min="18" max="100">
  </div>

  <button id="saveProfileBtn" class="btn full">Save Profile</button>

 </div>
</section>

<!-- CHAT -->
<section id="chatPage" class="page">
 <div class="card glass chat-card">

  <div class="chat-header">
   <button id="chatBackBtn" class="back-btn">‹</button>
   <div>
    <div id="chatTitle" class="chat-title">Chat</div>
    <div id="chatSubtitle" class="chat-subtitle"></div>
   </div>
  </div>

  <div id="messages" class="messages"></div>

  <div class="composer">
   <input id="messageInput" maxlength="4000" placeholder="Message…">
   <button id="sendBtn" class="btn">Send</button>
  </div>

 </div>
</section>

<!-- ABOUT -->
<section id="aboutPage" class="page">
 <div class="card glass">
  <div class="chat-header">
   <button id="aboutBackBtn" class="back-btn">‹</button>
   <h2 style="margin:0">About</h2>
  </div>
  <div id="aboutContent" class="about-content"></div>
 </div>
</section>

</main>

<nav class="bottom-nav glass">
 <button class="nav-item active" data-page="homePage">
  <span class="nav-icon">⌂</span>Home
 </button>
 <button class="nav-item" data-page="foryouPage">
  <span class="nav-icon">♡</span>For You
 </button>
 <button class="nav-item" data-page="settingsPage">
  <span class="nav-icon">⚙</span>Settings
 </button>
</nav>

</div>

<div id="toast" class="toast hidden"></div>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,
 signOut,setPersistence,browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
 getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,
 collection,query,where,orderBy,onSnapshot,addDoc,
 serverTimestamp,limit,getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
 getStorage,ref,uploadBytes,getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


/* Firebase */

const firebaseConfig={
 apiKey:"AIzaSyA3Ebqc9zxeSaRTUDYymJk78-UYezD76SU",
 authDomain:"flora-veilchat.firebaseapp.com",
 projectId:"flora-veilchat",
 storageBucket:"flora-veilchat.firebasestorage.app",
 messagingSenderId:"352485676905",
 appId:"1:352485676905:web:8beb0df80a0daea2cccff8",
 measurementId:"G-CQKB9Z8VP1"
};

const VERIFIED_BADGE=
"https://floraverse.github.io/veilchat/verified.png";

const districts=[
"Bagerhat","Bandarban","Barguna","Barishal","Bhola","Bogura",
"Brahmanbaria","Chandpur","Chattogram","Chuadanga","Cox's Bazar",
"Cumilla","Dhaka","Dinajpur","Faridpur","Feni","Gaibandha",
"Gazipur","Gopalganj","Habiganj","Jamalpur","Jashore","Jhalokathi",
"Jhenaidah","Joypurhat","Khagrachhari","Khulna","Kishoreganj",
"Kurigram","Kushtia","Lakshmipur","Lalmonirhat","Madaripur",
"Magura","Manikganj","Meherpur","Moulvibazar","Munshiganj",
"Mymensingh","Naogaon","Narail","Narayanganj","Narsingdi",
"Natore","Netrokona","Nilphamari","Noakhali","Pabna","Panchagarh",
"Patuakhali","Pirojpur","Rajbari","Rajshahi","Rangamati","Rangpur",
"Satkhira","Shariatpur","Sherpur","Sirajganj","Sunamganj","Sylhet",
"Tangail"
];

let auth,db,storage,currentUser,currentProfile,viewingProfile;
let activeChatUser,unsubscribeMessages;
let followingState=new Set();
let forYouUsers=[];
let forYouIndex=0;
let cameraStream=null;
let capturedPhotoBlob=null;

const $=id=>document.getElementById(id);

const esc=s=>String(s??"").replace(
 /[&<>"']/g,
 m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])
);

const avatar=p=>p?.photoURL||
"data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(
 '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">'+
 '<rect width="100%" height="100%" fill="#dceff3"/>'+
 '<circle cx="150" cy="110" r="52" fill="#7faeb8"/>'+
 '<path d="M50 280c15-70 55-100 100-100s85 30 100 100" fill="#7faeb8"/>'+
 '</svg>'
);

const badge=p=>p?.verified===true?
`<img class="verified" src="${VERIFIED_BADGE}" alt="Verified">`:"";

const chatId=(a,b)=>[a,b].sort().join("_");

function loading(v){
 $("loading").classList.toggle("hidden",!v);
}

function toast(t){
 $("toast").textContent=t;
 $("toast").classList.remove("hidden");
 clearTimeout(window.tt);
 window.tt=setTimeout(
  ()=>$("toast").classList.add("hidden"),3000
 );
}


/* Pages */

function showPage(id){

 document.querySelectorAll(".page")
 .forEach(x=>x.classList.remove("active"));

 $(id).classList.add("active");

 document.querySelectorAll(".nav-item")
 .forEach(x=>{
  x.classList.toggle(
   "active",
   x.dataset.page===id
  );
 });

 if(id==="homePage")renderHome();

 if(id==="profilePage")
  renderProfile(viewingProfile||currentProfile);

 if(id==="settingsPage"){
  renderSettings();
 }

 if(id==="foryouPage"){
  loadForYou();
 }

}


/* Profile */

async function loadProfile(){

 const s=await getDoc(
  doc(db,"users",currentUser.uid)
 );

 if(s.exists()){
  currentProfile={
   uid:currentUser.uid,
   ...s.data()
  };
  return true;
 }

 currentProfile={
  uid:currentUser.uid,
  name:currentUser.displayName||"",
  username:"",
  usernameLower:"",
  gender:"",
  district:"",
  thana:"",
  postOffice:"",
  postalCode:"",
  dateOfBirth:"",
  photoURL:"",
  bio:"",
  age:"",
  phone:"",
  nidNumber:"",
  visibility:{
   bio:"Public",
   age:"Only Me",
   phone:"Only Me",
   followers:"Public",
   following:"Public",
   online:"Public"
  },
  verified:false
 };

 return false;
}


function updateTopProfile(){

 $("topProfileImage").src=avatar(currentProfile);

}


/* Home */

function renderHome(){

 const p=currentProfile;

 $("homeProfile").innerHTML=`
 <div class="card glass center">
  <img class="avatar" src="${esc(avatar(p))}" alt="">
  <div class="profile-name">
   ${esc(p.name)}${badge(p)}
  </div>
  <div class="username">@${esc(p.username)}</div>
  <div class="profile-basic">
   ${esc(p.gender)} · ${esc(p.district)}
  </div>
 </div>`;
}


/* Privacy helpers */

const privacyOptions=["Public","Friends","Only Me"];

function privacySelect(key,label){

 const value=
  currentProfile.visibility?.[key]||"Only Me";

 return `
 <div class="setting-row">
  <div class="setting-left">
   <div class="setting-title">${label}</div>
  </div>

  <button
   class="setting-value"
   data-privacy="${key}"
   type="button"
  >
   ${esc(value)} <span>⌄</span>
  </button>
 </div>`;
}


function renderSettings(){

 const v=currentProfile.visibility||{};

 $("privacyContainer").innerHTML=
  privacySelect("bio","Bio")+
  privacySelect("age","Age")+
  privacySelect("phone","Phone Number")+
  privacySelect("followers","Followers")+
  privacySelect("following","Following");

 const online=v.online||"Public";

 $("onlineToggle").classList.toggle(
  "on",
  online!=="Only Me"
 );

 document.querySelectorAll("[data-privacy]")
 .forEach(btn=>{

  btn.onclick=async()=>{

   const key=btn.dataset.privacy;
   const current=
    currentProfile.visibility?.[key]||"Only Me";

   const next=
    privacyOptions[
     (privacyOptions.indexOf(current)+1)%privacyOptions.length
    ];

   currentProfile.visibility={
    ...(currentProfile.visibility||{}),
    [key]:next
   };

   try{

    await updateDoc(
     doc(db,"users",currentUser.uid),
     {visibility:currentProfile.visibility}
    );

    renderSettings();

   }catch(e){

    console.error(e);
    toast("Privacy update failed.");

   }

  };

 });

 $("onlineToggle").onclick=async()=>{

  const current=
   currentProfile.visibility?.online||"Public";

  const next=current==="Public"?"Only Me":"Public";

  currentProfile.visibility={
   ...(currentProfile.visibility||{}),
   online:next
  };

  try{

   await updateDoc(
    doc(db,"users",currentUser.uid),
    {visibility:currentProfile.visibility}
   );

   renderSettings();

  }catch(e){

   console.error(e);
   toast("Online status update failed.");

  }

 };

}


/* Profile visibility */

async function canSeeField(owner,key){

 if(owner.uid===currentUser.uid)return true;

 const setting=
  owner.visibility?.[key]||"Only Me";

 if(setting==="Public")return true;

 if(setting==="Only Me")return false;

 if(setting==="Friends"){

  const a=await getDoc(
   doc(db,"follows",`${currentUser.uid}_${owner.uid}`)
  );

  const b=await getDoc(
   doc(db,"follows",`${owner.uid}_${currentUser.uid}`)
  );

  return a.exists()&&b.exists();
 }

 return false;
}


async function renderProfile(p){

 if(!p)return;

 const me=p.uid===currentUser.uid;

 let bio="";
 let age="";
 let phone="";

 if(await canSeeField(p,"bio")&&p.bio)
  bio=`<div class="bio">${esc(p.bio)}</div>`;

 if(await canSeeField(p,"age")&&p.age)
  age=`<div class="status" style="margin-top:10px">
   Age ${esc(p.age)}
  </div>`;

 if(await canSeeField(p,"phone")&&p.phone)
  phone=`<div class="status" style="margin-top:6px">
   ${esc(p.phone)}
  </div>`;

 let followCount=0;

 try{

  const f=await getDocs(
   query(
    collection(db,"follows"),
    where("followingId","==",p.uid),
    limit(500)
   )
  );

  followCount=f.size;

 }catch(e){}

 let action="";

 if(me){

  action=`
   <button id="profileEditBtn" class="btn secondary">
    Edit Profile
   </button>`;

 }else{

  const isFollowing=
   followingState.has(p.uid);

  action=`
   <button id="profileFollowBtn"
    class="btn ${isFollowing?"following":""}">
    ${isFollowing?"Following":"Follow"}
   </button>

   <button id="profileMessageBtn"
    class="btn secondary">
    Message
   </button>`;
 }

 $("profileContainer").innerHTML=`
 <div class="card glass center">

  <img class="avatar"
   src="${esc(avatar(p))}" alt="">

  <div class="profile-name">
   ${esc(p.name)}${badge(p)}
  </div>

  <div class="username">
   @${esc(p.username)}
  </div>

  <div class="profile-basic">
   ${esc(p.gender)} ·
   ${esc(p.district)} ·
   ${esc(p.thana)}
  </div>

  ${bio}
  ${age}
  ${phone}

  <div class="stats">
   <div class="stat">
    <strong>${followCount}</strong>
    <small>Followers</small>
   </div>
   <div class="stat">
    <strong>${followingState.size}</strong>
    <small>Following</small>
   </div>
  </div>

  <div class="profile-actions">
   ${action}
  </div>

 </div>`;

 if(me){

  $("profileEditBtn").onclick=openEdit;

 }else{

  $("profileFollowBtn").onclick=
   ()=>toggleFollow(p);

  $("profileMessageBtn").onclick=
   ()=>startChat(p);

 }

}


/* Follow */

async function loadFollowing(){

 followingState=new Set();

 try{

  const q=query(
   collection(db,"follows"),
   where("followerId","==",currentUser.uid),
   limit(500)
  );

  const s=await getDocs(q);

  s.forEach(d=>{
   const x=d.data();
   if(x.followingId)
    followingState.add(x.followingId);
  });

 }catch(e){

  console.error(e);

 }

}


async function toggleFollow(p){

 if(!p||p.uid===currentUser.uid)return;

 const id=`${currentUser.uid}_${p.uid}`;
 const r=doc(db,"follows",id);

 const isFollowing=
  followingState.has(p.uid);

 const btn=
  $("profileFollowBtn")||
  $("followForYouBtn");

 try{

  if(isFollowing){

   await deleteDoc(r);

   followingState.delete(p.uid);

   if(btn){
    btn.textContent="Follow";
    btn.classList.remove("following");
   }

   toast("Unfollowed.");

  }else{

   await setDoc(r,{
    followerId:currentUser.uid,
    followingId:p.uid,
    createdAt:serverTimestamp()
   });

   followingState.add(p.uid);

   if(btn){
    btn.textContent="Following";
    btn.classList.add("following");
   }

   toast("Following.");

  }

  checkVerification();

 }catch(e){

  console.error(e);
  toast("Follow could not be updated.");

 }

}


/*
 Verification eligibility:
 required profile fields + at least 3 follows.
 The existing verified flag is not forcibly written here.
*/

function checkVerification(){

 const p=currentProfile;

 const complete=
  !!p.photoURL&&
  !!p.name&&
  !!p.username&&
  !!p.gender&&
  !!p.dateOfBirth&&
  !!p.district&&
  !!p.thana&&
  !!p.postOffice&&
  !!p.postalCode&&
  !!p.phone&&
  !!p.nidNumber&&
  !!p.bio&&
  Number(p.age)>=18;

 return complete&&followingState.size>=3;

}

$("passBtn").onclick=nextForYou;

/* Camera */

async function openCamera(){

 try{

  cameraStream=
   await navigator.mediaDevices.getUserMedia({
    video:{
     facingMode:"user"
    },
    audio:false
   });

  $("cameraVideo").srcObject=cameraStream;
  $("cameraVideo").style.display="block";
  $("editAvatar").classList.add("hidden");
  $("captureBtn").classList.remove("hidden");

 }catch(e){

  console.error(e);
  toast("Camera permission is required.");

 }

}


function stopCamera(){

 if(cameraStream){

  cameraStream.getTracks().forEach(t=>t.stop());
  cameraStream=null;

 }

 $("cameraVideo").style.display="none";
 $("captureBtn").classList.add("hidden");

}


function captureSelfie(){

 const video=$("cameraVideo");
 const canvas=$("cameraCanvas");

 if(!video.videoWidth){

  toast("Camera is not ready.");
  return;

 }

 canvas.width=video.videoWidth;
 canvas.height=video.videoHeight;

 const ctx=canvas.getContext("2d");

 ctx.drawImage(
  video,0,0,canvas.width,canvas.height
 );

 canvas.toBlob(blob=>{

  if(!blob)return;

  capturedPhotoBlob=blob;

  $("editAvatar").src=
   URL.createObjectURL(blob);

  $("editAvatar").classList.remove("hidden");

  stopCamera();

 }, "image/jpeg", .88);

}


/* Username */

async function usernameAvailable(u){

 const s=await getDocs(
  query(
   collection(db,"users"),
   where(
    "usernameLower",
    "==",
    u.toLowerCase()
   ),
   limit(2)
  )
 );

 return s.docs.every(
  d=>d.id===currentUser.uid
 );

}


/* Save Profile */

async function saveProfile(){

 const name=$("nameInput").value.trim();

 const username=
  $("usernameInput").value
  .trim()
  .replace(/^@/,"");

 const gender=$("genderInput").value;
 const dateOfBirth=$("dobInput").value;
 const district=$("districtInput").value;
 const thana=$("thanaInput").value.trim();
 const postOffice=$("postOfficeInput").value.trim();
 const postalCode=$("postalCodeInput").value.trim();
 const phone=$("phoneInput").value.trim();
 const nidNumber=$("nidInput").value.trim();
 const bio=$("bioInput").value.trim().slice(0,300);

 const age=$("ageInput").value?
  Number($("ageInput").value):"";

 if(
  !name||
  !username||
  !gender||
  !dateOfBirth||
  !district||
  !thana||
  !postOffice||
  !postalCode||
  !phone||
  !nidNumber||
  !bio||
  !age
 ){

  toast("Please complete all required fields.");
  return;

 }

 if(!/^[A-Za-z0-9_.]{3,30}$/.test(username)){

  toast("Username must be 3–30 letters, numbers, _ or .");
  return;

 }

 if(age<18||age>100){

  toast("Age must be between 18 and 100.");
  return;

 }

 if(!currentProfile.photoURL&&!capturedPhotoBlob){

  toast("Please take a selfie.");
  return;

 }

 loading(true);

 try{

  if(
   username.toLowerCase()!==
   (currentProfile.usernameLower||"")
  ){

   if(!await usernameAvailable(username)){

    toast("This username is already taken.");
    return;

   }

  }

  let photoURL=
   currentProfile.photoURL||"";

  if(capturedPhotoBlob){

   const r=ref(
    storage,
    `profilePhotos/${currentUser.uid}/${Date.now()}.jpg`
   );

   await uploadBytes(
    r,
    capturedPhotoBlob,
    {contentType:"image/jpeg"}
   );

   photoURL=await getDownloadURL(r);

  }

  const oldVisibility=
   currentProfile.visibility||{
    bio:"Public",
    age:"Only Me",
    phone:"Only Me",
    followers:"Public",
    following:"Public",
    online:"Public"
   };

  const data={

   uid:currentUser.uid,

   name,
   nameLower:name.toLowerCase(),

   username,
   usernameLower:username.toLowerCase(),

   gender,
   dateOfBirth,

   district,
   thana,
   postOffice,
   postalCode,

   phone,
   nidNumber,

   bio,
   age,

   photoURL,

   visibility:oldVisibility,

   updatedAt:serverTimestamp()

  };

  const r=doc(
   db,
   "users",
   currentUser.uid
  );

  const old=await getDoc(r);

  if(old.exists()){

   await updateDoc(r,data);

  }else{

   await setDoc(r,{
    ...data,
    verified:false,
    createdAt:serverTimestamp()
   });

  }

  capturedPhotoBlob=null;

  await loadProfile();
  await loadFollowing();

  updateTopProfile();

  viewingProfile=currentProfile;

  renderHome();

  showPage("profilePage");

  toast("Profile saved.");

 }catch(e){

  console.error(e);
  toast(
   e.message||
   "Profile could not be saved."
  );

 }finally{

  loading(false);

 }

}


/* Chat */

function startChat(p){

 activeChatUser=p;

 $("chatTitle").innerHTML=
  esc(p.name)+badge(p);

 $("chatSubtitle").textContent=
  "@"+p.username;

 showPage("chatPage");

 listenMessages();

}


function listenMessages(){

 if(unsubscribeMessages)
  unsubscribeMessages();

 const q=query(
  collection(
   db,
   "chats",
   chatId(
    currentUser.uid,
    activeChatUser.uid
   ),
   "messages"
  ),
  orderBy("createdAt","asc"),
  limit(300)
 );

 unsubscribeMessages=
  onSnapshot(q,s=>{

   const box=$("messages");

   box.innerHTML="";

   s.forEach(d=>{

    const m=d.data();

    const el=
     document.createElement("div");

    el.className=
     "message "+
     (
      m.senderId===currentUser.uid
      ?"mine"
      :"theirs"
     );

    el.textContent=m.text||"";

    box.appendChild(el);

   });

   box.scrollTop=box.scrollHeight;

  },e=>{

   console.error(e);
   toast("Chat connection failed.");

  });

}


async function sendMessage(){

 if(!activeChatUser)return;

 const input=$("messageInput");

 const text=
  input.value.trim();

 if(!text)return;

 input.value="";

 const id=
  chatId(
   currentUser.uid,
   activeChatUser.uid
  );

 try{

  await addDoc(
   collection(
    db,
    "chats",
    id,
    "messages"
   ),
   {
    senderId:currentUser.uid,
    receiverId:activeChatUser.uid,
    text,
    createdAt:serverTimestamp(),
    read:false
   }
  );

  await setDoc(
   doc(db,"chats",id),
   {
    participants:[
     currentUser.uid,
     activeChatUser.uid
    ],
    lastMessage:text.slice(0,200),
    updatedAt:serverTimestamp()
   },
   {merge:true}
  );

 }catch(e){

  console.error(e);

  input.value=text;

  toast("Message could not be sent.");

 }

}

/* Auth */

async function authState(user){

 if(!user){

  currentUser=null;

  $("app").classList.add("hidden");

  $("loginScreen").classList.remove("hidden");

  loading(false);

  return;

 }

 currentUser=user;

 $("loginScreen").classList.add("hidden");
 $("app").classList.remove("hidden");

 $("connectionStatus").textContent=
  "Connected";

 try{

  const exists=await loadProfile();

  await loadFollowing();

  updateTopProfile();

  const incomplete=
   !exists||
   !currentProfile.photoURL||
   !currentProfile.name||
   !currentProfile.username||
   !currentProfile.gender||
   !currentProfile.dateOfBirth||
   !currentProfile.district||
   !currentProfile.thana||
   !currentProfile.postOffice||
   !currentProfile.postalCode||
   !currentProfile.phone||
   !currentProfile.nidNumber||
   !currentProfile.bio||
   !currentProfile.age;

  if(incomplete){

   openEdit();

  }else{

   viewingProfile=currentProfile;
   showPage("homePage");

  }

 }catch(e){

  console.error(e);

  toast(
   "Could not load your profile."
  );

 }finally{

  loading(false);

 }

}


/* Districts */

districts.forEach(d=>{

 );

});

/* Firebase start */

async function start(){

 try{

  const app=
   initializeApp(firebaseConfig);

  auth=getAuth(app);

  db=getFirestore(app);

  storage=getStorage(app);

  await setPersistence(
   auth,
   browserLocalPersistence
  );

  onAuthStateChanged(
   auth,
   authState
  );

 }catch(e){

  console.error(e);

  loading(false);

  toast(
   "Firebase initialization failed."
  );

 }

}

start();
