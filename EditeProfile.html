<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Segoe UI,Tahoma,sans-serif;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 width:100%;
 min-height:100%;
}

body{
 color:#fff;
 background:
 radial-gradient(circle at 15% 10%,rgba(56,189,248,.28),transparent 30%),
 radial-gradient(circle at 90% 85%,rgba(37,99,235,.25),transparent 35%),
 linear-gradient(135deg,#020617,#0f172a,#172554,#020617);
 background-size:400% 400%;
 animation:bg 18s ease infinite;
}

@keyframes bg{
 0%,100%{background-position:0 50%}
 50%{background-position:100% 50%}
}

.app{
 width:100%;
 max-width:430px;
 min-height:100dvh;
 margin:auto;
 background:rgba(15,23,42,.27);
 backdrop-filter:blur(30px);
 -webkit-backdrop-filter:blur(30px);
 border:1px solid rgba(255,255,255,.12);
}

header{
 height:64px;
 display:flex;
 align-items:center;
 gap:15px;
 padding:0 17px;
 background:rgba(15,23,42,.25);
 border-bottom:1px solid rgba(255,255,255,.09);
 backdrop-filter:blur(25px);
 position:sticky;
 top:0;
 z-index:20;
}

header i{
 color:#94a3b8;
 cursor:pointer;
}

header h2{
 font-size:17px;
}

main{
 padding:16px;
 padding-bottom:30px;
}

.card{
 background:rgba(255,255,255,.045);
 border:1px solid rgba(255,255,255,.09);
 box-shadow:
 inset 0 1px rgba(255,255,255,.035),
 0 8px 30px rgba(0,0,0,.08);
 backdrop-filter:blur(20px);
 border-radius:22px;
 padding:18px;
}

.photo-area{
 text-align:center;
 margin-bottom:20px;
}

.photo-wrap{
 width:120px;
 height:120px;
 margin:auto;
 border-radius:50%;
 position:relative;
 overflow:hidden;
 background:rgba(56,189,248,.12);
 border:3px solid rgba(56,189,248,.45);
}

#profilePreview{
 width:100%;
 height:100%;
 object-fit:cover;
 display:none;
}

.photo-placeholder{
 width:100%;
 height:100%;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:45px;
 color:#38bdf8;
}

.camera-button{
 margin-top:12px;
 width:100%;
 padding:12px;
 border:1px solid rgba(56,189,248,.25);
 border-radius:13px;
 background:rgba(56,189,248,.09);
 color:#38bdf8;
 font-weight:650;
 cursor:pointer;
}

.camera-button:disabled{
 opacity:.5;
}

.camera-box{
 display:none;
 margin-top:14px;
 padding:12px;
 border-radius:18px;
 background:rgba(0,0,0,.2);
 border:1px solid rgba(255,255,255,.1);
}

#cameraVideo{
 width:100%;
 aspect-ratio:1/1;
 object-fit:cover;
 border-radius:15px;
 background:#000;
 transform:scaleX(-1);
}

.camera-actions{
 display:flex;
 gap:8px;
 margin-top:10px;
}

button{
 cursor:pointer;
 font:inherit;
}

.camera-actions button{
 flex:1;
 padding:12px;
 border-radius:12px;
 border:0;
 color:#fff;
 background:linear-gradient(135deg,#38bdf8,#2563eb);
}

.camera-actions .cancel{
 background:rgba(255,255,255,.07);
 border:1px solid rgba(255,255,255,.1);
}

.input-box{
 margin-bottom:14px;
}

.input-box label{
 display:block;
 color:#94a3b8;
 font-size:11px;
 margin-bottom:6px;
}

.input-box input,
.input-box textarea,
.input-box select{
 width:100%;
 padding:13px;
 border-radius:13px;
 color:#fff;
 background:rgba(255,255,255,.045);
 border:1px solid rgba(255,255,255,.09);
 outline:none;
}

.input-box select{
 background:#0f172a;
}

.input-box textarea{
 min-height:95px;
 resize:none;
}

.input-box input:focus,
.input-box textarea:focus,
.input-box select:focus{
 border-color:rgba(56,189,248,.5);
}

.required{
 color:#38bdf8;
}

.location-title{
 color:#38bdf8;
 font-size:12px;
 font-weight:650;
 margin:20px 0 10px;
}

.save-btn{
 width:100%;
 padding:14px;
 border:0;
 border-radius:14px;
 color:#fff;
 font-weight:700;
 background:linear-gradient(135deg,#38bdf8,#2563eb);
 box-shadow:0 8px 22px rgba(37,99,235,.28);
}

.status{
 margin-top:12px;
 padding:12px;
 border-radius:13px;
 font-size:12px;
 line-height:1.5;
 display:none;
}

.status.info{
 display:block;
 background:rgba(56,189,248,.07);
 border:1px solid rgba(56,189,248,.15);
 color:#94a3b8;
}

.status.success{
 display:block;
 background:rgba(34,197,94,.08);
 border:1px solid rgba(34,197,94,.2);
 color:#86efac;
}

.status.error{
 display:block;
 background:rgba(239,68,68,.08);
 border:1px solid rgba(239,68,68,.2);
 color:#fca5a5;
}

.verification{
 margin-top:16px;
 padding:13px;
 border-radius:15px;
 background:rgba(56,189,248,.06);
 border:1px solid rgba(56,189,248,.13);
 color:#94a3b8;
 font-size:11px;
 line-height:1.6;
}

.toast{
 position:fixed;
 left:50%;
 bottom:25px;
 transform:translate(-50%,20px);
 opacity:0;
 min-width:220px;
 max-width:90%;
 padding:11px 14px;
 text-align:center;
 border-radius:13px;
 background:rgba(15,23,42,.96);
 border:1px solid rgba(255,255,255,.12);
 transition:.25s;
 pointer-events:none;
 z-index:100;
 font-size:12px;
}

.toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

.hidden{
 display:none!important;
}

.loading{
 text-align:center;
 color:#94a3b8;
 padding:25px;
}

@media(max-width:480px){
 .app{
  border:0;
 }
}
</style>

<body>

<div class="app">

<header>
 <i class="fa-solid fa-arrow-left" onclick="goBack()"></i>
 <h2>Edit Profile</h2>
</header>

<main>

<div class="card">

<!-- PROFILE PHOTO -->

<div class="photo-area">

 <div class="photo-wrap">

   <div id="photoPlaceholder" class="photo-placeholder">
     <i class="fa-solid fa-user"></i>
   </div>

   <img id="profilePreview" alt="Profile">

 </div>

 <button
   type="button"
   class="camera-button"
   id="cameraButton"
   onclick="openCamera()">

   <i class="fa-solid fa-camera"></i>
   Take Selfie

 </button>

 <div id="cameraBox" class="camera-box">

   <video
     id="cameraVideo"
     autoplay
     playsinline>
   </video>

   <div class="camera-actions">

     <button
       type="button"
       onclick="captureSelfie()">

       <i class="fa-solid fa-camera"></i>
       Capture

     </button>

     <button
       type="button"
       class="cancel"
       onclick="closeCamera()">

       Cancel

     </button>

   </div>

 </div>

</div>


<!-- NAME -->

<div class="input-box">

<label>
 Full Name <span class="required">*</span>
</label>

<input
 id="name"
 type="text"
 maxlength="80"
 autocomplete="name"
 placeholder="Your full name">

</div>


<!-- USERNAME -->

<div class="input-box">

<label>
 Username <span class="required">*</span>
</label>

<input
 id="username"
 type="text"
 maxlength="25"
 autocomplete="username"
 placeholder="@username">

</div>


<!-- EMAIL -->

<div class="input-box">

<label>
 Email <span class="required">*</span>
</label>

<input
 id="email"
 type="email"
 maxlength="120"
 autocomplete="email"
 placeholder="your@email.com">

</div>


<!-- PHONE -->

<div class="input-box">

<label>
 Phone <span class="required">*</span>
</label>

<input
 id="phone"
 type="tel"
 maxlength="20"
 autocomplete="tel"
 placeholder="01XXXXXXXXX">

</div>


<!-- BIO -->

<div class="input-box">

<label>
 Bio <span class="required">*</span>
</label>

<textarea
 id="bio"
 maxlength="500"
 placeholder="Write something about yourself..."></textarea>

</div>


<!-- BANGLADESH LOCATION -->

<div class="location-title">
 <i class="fa-solid fa-location-dot"></i>
 Bangladesh Location
</div>


<div class="input-box">

<label>
 District <span class="required">*</span>
</label>

<select id="district">
 <option value="">Select District</option>
</select>

</div>


<div class="input-box">

<label>
 Thana / Upazila <span class="required">*</span>
</label>

<select id="upazila" disabled>
 <option value="">Select Thana / Upazila</option>
</select>

</div>


<div class="input-box">

<label>
 Postal Code <span class="required">*</span>
</label>

<select id="postalCode" disabled>
 <option value="">Select Postal Code</option>
</select>

</div>


<button
 type="button"
 class="save-btn"
 id="saveButton"
 onclick="saveProfile()">

 <i class="fa-solid fa-floppy-disk"></i>
 Save Profile

</button>


<div id="status" class="status"></div>


<div class="verification">

<strong style="color:#38bdf8">
Selfie Verification
</strong>

<br>

Verification হবে তখনই যখন:

<br>
✓ Name সম্পূর্ণ

<br>
✓ Username সম্পূর্ণ

<br>
✓ Email সম্পূর্ণ

<br>
✓ Phone সম্পূর্ণ

<br>
✓ Bio সম্পূর্ণ

<br>
✓ Bangladesh District নির্বাচন করা

<br>
✓ Thana / Upazila নির্বাচন করা

<br>
✓ Postal Code নির্বাচন করা

<br>
✓ Clear selfie নেওয়া

</div>

</div>

</main>

</div>

<div id="toast" class="toast"></div>

function toast(message){

 const box = $("toast");

 box.textContent = message;

 box.classList.add("show");

 clearTimeout(window.toastTimer);

 window.toastTimer = setTimeout(()=>{
   box.classList.remove("show");
 },3000);
}


function status(message,type="info"){

 const box = $("status");

 box.className = "status "+type;

 box.textContent = message;

}


function firebaseError(error){

 console.error(error);

 const code = error?.code || "";

 const map = {

  "permission-denied":
   "Firestore permission denied. Firebase Rules check করুন.",

  "auth/network-request-failed":
   "Network connection failed.",

  "auth/requires-recent-login":
   "Please login again.",

  "unavailable":
   "Firebase temporarily unavailable."

 };

 return map[code] || error?.message || "Firebase operation failed.";
}


function safeImage(value){

 return typeof value === "string" &&
        value.startsWith("data:image/")
        ? value
        : "";
}


function makeUsername(name){

 let value = String(name || "user")
   .toLowerCase()
   .replace(/[^a-z0-9]/g,"")
   .slice(0,14);

 return "@"+(value || "user");
}

/* =========================================================
   DISTRICT DROPDOWN
========================================================= */

function loadDistricts(){

 const select = $("district");

 Object.keys(BD)
   .sort()
   .forEach(district=>{

     const option =
       document.createElement("option");

     option.value = district;
     option.textContent = district;

     select.appendChild(option);

   });

}


$("district").onchange = function(){

 const district = this.value;

 const upazila = $("upazila");
 const postal = $("postalCode");

 upazila.innerHTML =
   '<option value="">Select Thana / Upazila</option>';

 postal.innerHTML =
   '<option value="">Select Postal Code</option>';

 postal.disabled = true;

 if(!district){

   upazila.disabled = true;

   return;

 }

 const areas = BD[district] || {};

 Object.keys(areas)
   .sort()
   .forEach(area=>{

     const option =
       document.createElement("option");

     option.value = area;
     option.textContent = area;

     upazila.appendChild(option);

   });

 upazila.disabled = false;
};


$("upazila").onchange = function(){

 const district = $("district").value;
 const area = this.value;

 const postal = $("postalCode");

 postal.innerHTML =
   '<option value="">Select Postal Code</option>';

 if(!district || !area){

   postal.disabled = true;

   return;

 }

 const codes = BD[district]?.[area] || [];

 codes.forEach(code=>{

   const option =
     document.createElement("option");

   option.value = code;
   option.textContent = code;

   postal.appendChild(option);

 });

 postal.disabled = codes.length === 0;
};


/* =========================================================
   AUTH
========================================================= */

auth.onAuthStateChanged(async user=>{

 if(!user){

   currentUser = null;

   status(
     "You are not logged in. Open this page from the logged-in VEIL account.",
     "error"
   );

   $("saveButton").disabled = true;

   return;

 }

 currentUser = user;

 $("saveButton").disabled = false;

 await loadProfile();

});


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

 if(!currentUser)return;

 try{

   const snap =
     await db
     .collection("users")
     .doc(currentUser.uid)
     .get();

   if(!snap.exists){

     status(
       "Profile document was not found.",
       "error"
     );

     return;

   }

   currentProfile = snap.data();

   $("name").value =
     currentProfile.name || currentUser.displayName || "";

   $("username").value =
     currentProfile.username ||
     makeUsername(currentProfile.name || currentUser.displayName);

   $("email").value =
     currentProfile.email ||
     currentUser.email ||
     "";

   $("phone").value =
     currentProfile.phone || "";

   $("bio").value =
     currentProfile.bio || "";

   selfieData =
     safeImage(currentProfile.photoData || "");

   if(selfieData){

     showPhoto(selfieData);

   }

   /*
    * Restore Bangladesh location.
    */

   if(currentProfile.country === "Bangladesh" ||
      currentProfile.country === "BD"){

     $("district").value =
       currentProfile.district || "";

     $("district").dispatchEvent(
       new Event("change")
     );

     $("upazila").value =
       currentProfile.upazila ||
       currentProfile.thana ||
       "";

     $("upazila").dispatchEvent(
       new Event("change")
     );

     $("postalCode").value =
       currentProfile.postalCode || "";

   }

   status(
     "Profile loaded. Make your changes and save.",
     "info"
   );

 }catch(error){

   status(
     firebaseError(error),
     "error"
   );

 }

}


/* =========================================================
   PHOTO
========================================================= */

function showPhoto(data){

 const image = $("profilePreview");
 const placeholder = $("photoPlaceholder");

 if(!safeImage(data)){

   image.style.display = "none";
   placeholder.style.display = "flex";

   return;

 }

 image.src = data;
 image.style.display = "block";
 placeholder.style.display = "none";

}


/* =========================================================
   CAMERA
========================================================= */

async function openCamera(){

 if(!currentUser){

   toast("Please login first.");

   return;

 }

 /*
  * Profile completion is required before selfie.
  */

 if(!basicProfileComplete()){

   toast(
     "Complete Name, Username, Email, Phone and Bio first."
   );

   return;

 }

 if(!navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia){

   toast(
     "Camera requires HTTPS or localhost."
   );

   return;

 }

 try{

   cameraStream =
     await navigator.mediaDevices.getUserMedia({

       video:{
         facingMode:{
           ideal:"user"
         },

         width:{
           ideal:1280
         },

         height:{
           ideal:1280
         }
       },

       audio:false

     });

   const video = $("cameraVideo");

   video.srcObject = cameraStream;

   $("cameraBox").style.display = "block";

   $("cameraButton").style.display = "none";

   await video.play();

 }catch(error){

   console.error(error);

   toast(
     "Camera permission denied or camera unavailable."
   );

 }

}


function closeCamera(){

 if(cameraStream){

   cameraStream
    .getTracks()
    .forEach(track=>track.stop());

 }

 cameraStream = null;

 $("cameraVideo").srcObject = null;

 $("cameraBox").style.display = "none";

 $("cameraButton").style.display = "block";

}


/* =========================================================
   CAPTURE
========================================================= */

function captureSelfie(){

 if(!cameraStream){

   toast("Camera is not active.");

   return;

 }

 const video = $("cameraVideo");

 if(!video.videoWidth){

   toast("Camera is not ready.");

   return;

 }

 const size =
   Math.min(
     video.videoWidth,
     video.videoHeight
   );

 const canvas =
   document.createElement("canvas");

 canvas.width = 640;
 canvas.height = 640;

 const ctx =
   canvas.getContext("2d");

 /*
  * Mirror selfie exactly like the preview.
  */

 ctx.translate(640,0);
 ctx.scale(-1,1);

 ctx.drawImage(
   video,
   (video.videoWidth-size)/2,
   (video.videoHeight-size)/2,
   size,
   size,
   0,
   0,
   640,
   640
 );

 selfieData =
   canvas.toDataURL(
     "image/jpeg",
     .72
   );

 if(selfieData.length > 1000000){

   toast(
     "Photo is too large. Please capture again."
   );

   selfieData = "";

   return;

 }

 showPhoto(selfieData);

 closeCamera();

 toast("Selfie captured. Press Save Profile.");

}


/* =========================================================
   VALIDATION
========================================================= */

function basicProfileComplete(){

 const name =
   $("name").value.trim();

 const username =
   $("username").value.trim();

 const email =
   $("email").value.trim();

 const phone =
   $("phone").value.trim();

 const bio =
   $("bio").value.trim();

 return Boolean(
   name &&
   username &&
   email &&
   phone &&
   bio
 );

}


function validEmail(email){

 return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
   .test(email);

}


function validBangladeshPhone(phone){

 const cleaned =
   phone.replace(/[\s-]/g,"");

 return /^(\+8801|01)[3-9]\d{8}$/
   .test(cleaned);

}


/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile(){

 if(!currentUser){

   toast("Please login first.");

   return;

 }

 const name =
   $("name").value.trim();

 let username =
   $("username").value.trim();

 const email =
   $("email").value.trim();

 const phone =
   $("phone").value.trim();

 const bio =
   $("bio").value.trim();

 const district =
   $("district").value;

 const upazila =
   $("upazila").value;

 const postalCode =
   $("postalCode").value;


 /* BASIC */

 if(!name){

   toast("Name is required.");

   return;

 }

 if(!username){

   username = makeUsername(name);

 }

 username =
   username.toLowerCase();

 if(!username.startsWith("@")){

   username = "@"+username;

 }

 username =
   username
   .replace(/[^@a-z0-9_]/g,"")
   .slice(0,25);


 if(!email || !validEmail(email)){

   toast("Enter a valid email.");

   return;

 }


 if(!phone || !validBangladeshPhone(phone)){

   toast(
     "Enter a valid Bangladesh phone number."
   );

   return;

 }


 if(!bio){

   toast("Bio is required.");

   return;

 }


 /* LOCATION */

 if(!district){

   toast("Select District.");

   return;

 }

 if(!BD[district]){

   toast("Invalid District.");

   return;

 }

 if(!upazila){

   toast("Select Thana / Upazila.");

   return;

 }

 if(!BD[district][upazila]){

   toast("Invalid Thana / Upazila.");

   return;

 }

 if(!postalCode){

   toast("Select Postal Code.");

   return;

 }

 if(!BD[district][upazila].includes(postalCode)){

   toast("Invalid Postal Code.");

   return;

 }


 /* SELFIE */

 if(!selfieData){

   toast(
     "Take a clear selfie before verification."
   );

   return;

 }


 const saveButton =
   $("saveButton");

 saveButton.disabled = true;

 status(
   "Saving profile...",
   "info"
 );


 try{

   /*
    * Read latest profile before saving.
    */

   const ref =
     db
     .collection("users")
     .doc(currentUser.uid);

   const latestSnap =
     await ref.get();

   if(!latestSnap.exists){

     throw new Error(
       "User profile does not exist."
     );

   }


   /*
    * Final verification condition.
    */

   const complete =
     Boolean(
       name &&
       username &&
       email &&
       phone &&
       bio &&
       district &&
       upazila &&
       postalCode &&
       selfieData
     );


   const updates = {

     uid: currentUser.uid,

     name: name,

     username: username,

     email: email,

     phone: phone,

     bio: bio,

     country: "Bangladesh",

     countryCode: "BD",

     district: district,

     upazila: upazila,

     thana: upazila,

     postalCode: postalCode,

     photoData: selfieData,

     verified: complete,

     updatedAt:
       firebase.firestore.FieldValue.serverTimestamp(),

     lastActive:
       firebase.firestore.FieldValue.serverTimestamp()

   };


   await ref.update(updates);


   currentProfile = {
     ...(latestSnap.data() || {}),
     ...updates
   };


   status(
     complete
       ? "Profile saved successfully. Selfie verification is complete."
       : "Profile saved.",
     "success"
   );


   toast(
     complete
       ? "Profile verified successfully."
       : "Profile updated."
   );


   /*
    * Optional: notify parent index.html if opened
    * inside an iframe/window.
    */

   try{

     if(window.opener){

       window.opener.postMessage(
         {
           type:"VEIL_PROFILE_UPDATED",
           uid:currentUser.uid
         },
         "*"
       );

     }

   }catch(e){}


 }catch(error){

   console.error(
     "SAVE PROFILE ERROR:",
     error
   );

   status(
     firebaseError(error),
     "error"
   );

   toast(
     firebaseError(error)
   );

 }finally{

   saveButton.disabled = false;

 }

}
